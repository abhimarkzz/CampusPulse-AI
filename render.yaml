# Render Blueprint — CampusPulse AI Backend
# Deploy: Render Dashboard → New Blueprint → connect abhimarkzz/CampusPulse-AI

databases:
  - name: campuspulse-db
    plan: free
    databaseName: campuspulse
    user: campuspulse

services:
  - type: web
    name: campuspulse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e .
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: campuspulse-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://campuspulse-ai-klh.netlify.app,https://abhimarkzz.github.io
      - key: AI_PROVIDER
        value: mock
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
