# fly.toml — Fly.io backend deploy
app = "campuspulse-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DEBUG = "false"
  AI_PROVIDER = "mock"
  CORS_ORIGINS = "https://campuspulse-ai-klh.netlify.app,https://abhimarkzz.github.io,http://localhost:5173"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
